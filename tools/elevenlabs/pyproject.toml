[project]
name = "agent-voice"
version = "0.1.0"
description = "Voice narration for Claude Code agents via ElevenLabs TTS"
authors = [{ name = "Rob Gruhl" }]
readme = "CLAUDE.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "elevenlabs (>=2.69.0,<3.0.0)",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "httpx>=0.25.0",
]

[project.scripts]
agent-voice = "agent_voice.cli:cli"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "agent_voice" }]
