# TTRPG/Gaming transcription preset
name: gaming
description: Optimized for tabletop RPG sessions with fantasy vocabulary

backend: whisper_cpp
base_url: http://127.0.0.1:2022
timeout: 600

language: en
# Fantasy/TTRPG vocabulary hints
prompt: >
  Dungeons & Dragons, D&D, dungeon master, DM, player character, NPC,
  initiative, saving throw, ability check, hit points, HP, armor class, AC,
  spell slot, cantrip, concentration, advantage, disadvantage, critical hit,
  natural 20, nat 20, d20, d12, d10, d8, d6, d4, modifier, proficiency bonus,
  multiclass, subclass, warlock, wizard, sorcerer, cleric, paladin, ranger,
  rogue, fighter, barbarian, bard, druid, monk, artificer

timestamps: false
output_format: txt
